# Render Blueprint — deploys the HopeMind API (free web service) and the web app (free static site).
# Usage: Render dashboard → New → Blueprint → point at this repo. Render reads this file
# and creates the service below; you only need to fill in the "sync: false" secrets
# (DATABASE_URL, DIRECT_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET) in its dashboard —
# copy DATABASE_URL/DIRECT_URL from the Supabase project (see database/README.md).
services:
  - type: web
    name: hopemind-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: with NODE_ENV=production set below, plain `npm install` skips
    # devDependencies — but @nestjs/cli (the `nest` build tool) lives there, so the
    # build itself needs them. `npm ci` uses package-lock.json for a reproducible install.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CORS_ORIGIN
        # Comma-separated origins allowed to call the API with cookies (the mobile app
        # doesn't need to be listed — it isn't a browser, so CORS doesn't apply to it).
        # Add your deployed frontend's URL here once it exists; http://localhost:5173
        # covers running the web frontend locally against this hosted API.
        value: https://hopemind-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  # Web app (React + Vite) as a static site. Requests to /api/* are proxied to the API, so the
  # browser sees a single origin: onrender.com is a public suffix, which would otherwise make the
  # login cookie a third-party cookie (blocked by Safari and by some Chrome settings).
  - type: web
    name: hopemind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hopemind-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# Esteira de integração contínua (Plano e Projeto de Teste, seções 2.2 e 3.2 — RNF-010 / EN-02).
# Todo Pull Request e todo push na main precisam passar por aqui. O deploy da API no Render
# continua automático a partir da main (render.yaml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (NestJS) — lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes unitários + cobertura (mínimo 80% de linhas)
        run: npm run test:cov
      - name: Testes de integração HTTP (Jest + Supertest, banco simulado)
        run: npm run test:e2e
      - name: Build
        run: npm run build

  web:
    name: Web (React) — lint, tipos, testes, build e E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes de componentes (Vitest + Testing Library)
        run: npm run test:cov
      - name: Build
        run: npm run build
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E de responsividade (360px, 768px e 1440px)
        run: npx playwright test
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
